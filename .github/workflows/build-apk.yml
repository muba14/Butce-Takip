name: APK oluştur ve yayınla

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Platform dosyalarını oluştur (yoksa)
        run: flutter create --platforms=android,ios --org com.butcetakip .

      - name: Uygulama adını ayarla
        run: sed -i 's/android:label="[^"]*"/android:label="Bütçe Takip"/' android/app/src/main/AndroidManifest.xml

      - run: flutter pub get
      - run: flutter test
      - run: dart run flutter_launcher_icons
      - run: flutter build apk --release

      - name: Sürüm numarasını oku
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //; s/+.*//')
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          cp build/app/outputs/flutter-apk/app-release.apk "ButceTakip-v$VERSION.apk"

      - name: APK'yı Actions'a yükle
        uses: actions/upload-artifact@v4
        with:
          name: ButceTakip-v${{ env.VERSION }}
          path: ButceTakip-v${{ env.VERSION }}.apk

      - name: GitHub Release oluştur
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: Bütçe Takip v${{ env.VERSION }}
          make_latest: true
          files: ButceTakip-v${{ env.VERSION }}.apk
          body: |
            Android için APK. Telefona indirip kur; "bilinmeyen kaynaklar" izni istenirse onayla.
            Eski bir sürüm yüklüyse ve "uygulama yüklenmedi" hatası alırsan önce eskisini kaldır.
